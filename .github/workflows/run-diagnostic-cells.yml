name: Run diagnostic matchup cells

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Diagnostic matchup set
        required: true
        default: contrast
        type: choice
        options:
          - contrast
          - mega
          - best-plan
          - sun
      games_per_cell:
        description: Fully traced games per selected matchup cell
        required: true
        default: '10'
        type: choice
        options:
          - '5'
          - '10'
          - '20'
      seed:
        description: Reproducible random seed
        required: true
        default: '20260916'
        type: string

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      VGC_TRACE: '1'
      VGC_NODE: node

    steps:
      - name: Check out matchup repo
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Install pinned Pokémon Showdown
        run: |
          mkdir -p "$HOME/code/projects"
          git clone --filter=blob:none https://github.com/smogon/pokemon-showdown.git "$HOME/code/projects/pokemon-showdown"
          cd "$HOME/code/projects/pokemon-showdown"
          git checkout efe494857
          npm ci
          npm run build

      - name: Run turn-by-turn diagnostics
        run: |
          python offline/diagnose_preview_cells.py \
            --team-a teams/recksal_mc.packed.txt \
            --team-b teams/yamazaki_worlds_2026.packed.txt \
            --scenario '${{ inputs.scenario }}' \
            --games-per-cell '${{ inputs.games_per_cell }}' \
            --seed '${{ inputs.seed }}' \
            --output runs/matchups/diagnostic-cells.json

      - name: Write readable summary
        if: always() && hashFiles('runs/matchups/diagnostic-cells.json') != ''
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          data = json.loads(Path('runs/matchups/diagnostic-cells.json').read_text())
          lines = [
              '# Pokémon Champions M-C diagnostic cells',
              '',
              f"**Scenario:** {data['scenario']}",
              f"**Games per cell:** {data['games_per_cell']}",
              f"**Seed:** {data['seed']}",
              '',
              '## Results',
              '',
              '| Our forced plan | Opponent forced plan | Record | Win rate | Mean turns | Fallbacks |',
              '|---|---|---:|---:|---:|---:|',
          ]
          for cell in data['cells']:
              s = cell['summary']
              fb = s['fallbacks']['team-a'] + s['fallbacks']['team-b']
              lines.append(
                  f"| {cell['a_plan']['name']} | {cell['b_plan']['name']} | "
                  f"{s['a_wins']}–{s['b_wins']}–{s['draws']} | {s['a_win_rate']:.1%} | "
                  f"{s['mean_turns']:.2f} | {fb} |"
              )

          lines += ['', '## First game in each cell', '']
          for cell in data['cells']:
              game = cell['games'][0]
              lines += [
                  f"### {cell['a_plan']['name']} vs {cell['b_plan']['name']}",
                  '',
                  f"Winner: **{game['winner_agent']}** — {game['turns']} turns",
                  '',
                  '| Turn | Choices | Key resolved events |',
                  '|---:|---|---|',
              ]
              shown = 0
              for step in game['steps']:
                  # Skip pure team-preview row in the concise summary; it remains in JSON.
                  if step['turn_before'] == 0 and all(str(v).startswith('team ') for v in step['choices'].values()):
                      continue
                  choices = '<br>'.join(f"{side}: `{choice}`" for side, choice in step['choices'].items())
                  events = '<br>'.join(step['events'][:8]).replace('|', '\\|')
                  lines.append(f"| {step['turn_before']} | {choices} | {events} |")
                  shown += 1
                  if shown >= 12:
                      break
              lines.append('')

          lines += [
              '> Full per-decision VGC traces and both sides’ fogged Showdown protocol are in the downloadable JSON artifact.',
          ]
          Path(os.environ['GITHUB_STEP_SUMMARY']).write_text('\n'.join(lines) + '\n')
          PY

      - name: Upload full diagnostic report
        if: always() && hashFiles('runs/matchups/diagnostic-cells.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: diagnostic-${{ inputs.scenario }}-${{ inputs.games_per_cell }}-seed-${{ inputs.seed }}
          path: runs/matchups/diagnostic-cells.json
          retention-days: 30
