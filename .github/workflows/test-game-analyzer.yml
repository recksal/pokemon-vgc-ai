name: Test game analyzer

on:
  push:
    branches:
      - feature/game-analyzer-v1
    paths:
      - 'src/vgc/game_analyzer.py'
      - 'offline/analyze_game.py'
      - 'tests/test_game_analyzer.py'
      - 'tests/test_human_capture.py'
      - 'tests/integration/test_local_battles.py'
      - 'src/vgc/human_capture.py'
      - 'offline/play_and_analyze.py'
      - 'offline/check_remote_analyzer_ready.py'
      - 'src/vgc/config.py'
      - '.devcontainer/**'
      - 'src/vgc/battle_state_replay.py'
      - 'src/vgc/actions.py'
      - 'src/vgc/search.py'
      - 'src/vgc/evaluator.py'
      - 'docs/game_analyzer_v1.md'
      - '.github/workflows/test-game-analyzer.yml'
  pull_request:
    paths:
      - 'src/vgc/game_analyzer.py'
      - 'offline/analyze_game.py'
      - 'tests/test_game_analyzer.py'
      - 'tests/test_human_capture.py'
      - 'tests/integration/test_local_battles.py'
      - 'src/vgc/human_capture.py'
      - 'offline/play_and_analyze.py'
      - 'offline/check_remote_analyzer_ready.py'
      - 'src/vgc/config.py'
      - '.devcontainer/**'
      - 'src/vgc/battle_state_replay.py'
      - 'src/vgc/actions.py'
      - 'src/vgc/search.py'
      - 'src/vgc/evaluator.py'
      - 'docs/game_analyzer_v1.md'
      - '.github/workflows/test-game-analyzer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: python -m pip install uv

      - name: Install development dependencies
        run: uv sync --extra dev

      - name: Ruff
        run: |
          .venv/bin/python -m ruff check \
            src/vgc/game_analyzer.py \
            src/vgc/human_capture.py \
            offline/analyze_game.py \
            offline/play_and_analyze.py \
            offline/check_remote_analyzer_ready.py \
            src/vgc/config.py \
            tests/test_game_analyzer.py \
            tests/test_human_capture.py

      - name: Validate Codespaces files
        run: |
          python -m json.tool .devcontainer/devcontainer.json >/dev/null
          bash -n .devcontainer/setup.sh

      - name: Portable Showdown path contract
        env:
          VGC_SHOWDOWN_REPO: /tmp/vgc-showdown-portability-test
        run: |
          value="$(.venv/bin/python -c 'from vgc.config import SHOWDOWN_REPO; print(SHOWDOWN_REPO)')"
          test "$value" = "/tmp/vgc-showdown-portability-test"

      - name: Analyzer and replay contract tests
        run: |
          .venv/bin/python -m pytest \
            tests/test_game_analyzer.py \
            tests/test_human_capture.py \
            tests/test_battle_state_replay.py

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      VGC_SHOWDOWN_REPO: ${{ runner.temp }}/pokemon-showdown

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'

      - name: Run Codespaces bootstrap
        run: bash .devcontainer/setup.sh

      - name: End-to-end analyzer replay contract
        run: |
          .venv/bin/python -m pytest -m integration \
            tests/integration/test_local_battles.py::test_game_analyzer_consumes_real_mc_decision_bundle \
            tests/integration/test_local_battles.py::test_human_capture_records_verifiable_analyzable_game
