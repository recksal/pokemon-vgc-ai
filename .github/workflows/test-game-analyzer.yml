name: Test game analyzer

on:
  pull_request:
    paths:
      - 'src/vgc/game_analyzer.py'
      - 'offline/analyze_game.py'
      - 'tests/test_game_analyzer.py'
      - 'src/vgc/battle_state_replay.py'
      - 'src/vgc/actions.py'
      - 'src/vgc/search.py'
      - 'src/vgc/evaluator.py'
      - 'docs/game_analyzer_v1.md'
      - '.github/workflows/test-game-analyzer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: python -m pip install uv

      - name: Install development dependencies
        run: uv sync --extra dev

      - name: Ruff
        run: |
          .venv/bin/python -m ruff check \
            src/vgc/game_analyzer.py \
            offline/analyze_game.py \
            tests/test_game_analyzer.py

      - name: Analyzer and replay contract tests
        run: |
          .venv/bin/python -m pytest \
            tests/test_game_analyzer.py \
            tests/test_battle_state_replay.py
