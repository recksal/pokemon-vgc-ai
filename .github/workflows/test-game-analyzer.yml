name: Test game analyzer

on:
  push:
    branches:
      - feature/game-analyzer-v1
    paths:
      - 'src/vgc/game_analyzer.py'
      - 'offline/analyze_game.py'
      - 'tests/test_game_analyzer.py'
      - 'tests/test_human_capture.py'
      - 'tests/integration/test_local_battles.py'
      - 'src/vgc/human_capture.py'
      - 'offline/play_and_analyze.py'
      - 'src/vgc/battle_state_replay.py'
      - 'src/vgc/actions.py'
      - 'src/vgc/search.py'
      - 'src/vgc/evaluator.py'
      - 'docs/game_analyzer_v1.md'
      - '.github/workflows/test-game-analyzer.yml'
  pull_request:
    paths:
      - 'src/vgc/game_analyzer.py'
      - 'offline/analyze_game.py'
      - 'tests/test_game_analyzer.py'
      - 'tests/test_human_capture.py'
      - 'tests/integration/test_local_battles.py'
      - 'src/vgc/human_capture.py'
      - 'offline/play_and_analyze.py'
      - 'src/vgc/battle_state_replay.py'
      - 'src/vgc/actions.py'
      - 'src/vgc/search.py'
      - 'src/vgc/evaluator.py'
      - 'docs/game_analyzer_v1.md'
      - '.github/workflows/test-game-analyzer.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install uv
        run: python -m pip install uv

      - name: Install development dependencies
        run: uv sync --extra dev

      - name: Ruff
        run: |
          .venv/bin/python -m ruff check \
            src/vgc/game_analyzer.py \
            src/vgc/human_capture.py \
            offline/analyze_game.py \
            offline/play_and_analyze.py \
            tests/test_game_analyzer.py \
            tests/test_human_capture.py

      - name: Analyzer and replay contract tests
        run: |
          .venv/bin/python -m pytest \
            tests/test_game_analyzer.py \
            tests/test_human_capture.py \
            tests/test_battle_state_replay.py

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'

      - name: Install uv
        run: python -m pip install uv

      - name: Install development dependencies
        run: uv sync --extra dev

      - name: Install pinned Pokémon Showdown
        run: |
          sudo mkdir -p /Users/edmundyu/code/projects
          sudo chown -R "$USER":"$USER" /Users/edmundyu
          git clone --filter=blob:none https://github.com/smogon/pokemon-showdown.git \
            /Users/edmundyu/code/projects/pokemon-showdown
          cd /Users/edmundyu/code/projects/pokemon-showdown
          git checkout efe494857
          npm ci
          npm run build

      - name: End-to-end analyzer replay contract
        run: |
          .venv/bin/python -m pytest -m integration \
            tests/integration/test_local_battles.py::test_game_analyzer_consumes_real_mc_decision_bundle \
            tests/integration/test_local_battles.py::test_human_capture_records_verifiable_analyzable_game
