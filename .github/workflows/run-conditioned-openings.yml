name: Run conditioned opening comparison

on:
  workflow_dispatch:
    inputs:
      trajectories:
        description: Different opponent/continuation trajectories per opening
        required: true
        default: '100'
        type: choice
        options:
          - '50'
          - '100'
          - '200'
      repeats:
        description: Showdown RNG repeats per trajectory
        required: true
        default: '3'
        type: choice
        options:
          - '3'
          - '5'
      diversify_turns:
        description: Number of opening turns to diversify after forced turn 1
        required: true
        default: '5'
        type: choice
        options:
          - '3'
          - '5'
      score_gap:
        description: Include legal joint orders within this many evaluator points of best
        required: true
        default: '100'
        type: choice
        options:
          - '60'
          - '80'
          - '100'
          - '140'
      max_candidates:
        description: Safety cap on qualified joint orders per decision
        required: true
        default: '20'
        type: choice
        options:
          - '10'
          - '20'
          - '30'
      temperature:
        description: Exploration temperature in evaluator score units
        required: true
        default: '35'
        type: choice
        options:
          - '20'
          - '35'
          - '50'
      seed:
        description: Reproducible master seed
        required: true
        default: '20260916'
        type: string

permissions:
  contents: read

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      VGC_TRACE: '1'
      VGC_NODE: node

    steps:
      - name: Check out matchup repo
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Install pinned Pokémon Showdown
        run: |
          mkdir -p "$HOME/code/projects"
          git clone --filter=blob:none https://github.com/smogon/pokemon-showdown.git "$HOME/code/projects/pokemon-showdown"
          cd "$HOME/code/projects/pokemon-showdown"
          git checkout efe494857
          npm ci
          npm run build

      - name: Compare conditioned openings
        run: |
          python offline/compare_conditioned_openings.py \
            --team-a teams/recksal_mc.packed.txt \
            --team-b teams/yamazaki_worlds_2026.packed.txt \
            --trajectories '${{ inputs.trajectories }}' \
            --repeats '${{ inputs.repeats }}' \
            --diversify-turns '${{ inputs.diversify_turns }}' \
            --score-gap '${{ inputs.score_gap }}' \
            --max-candidates '${{ inputs.max_candidates }}' \
            --temperature '${{ inputs.temperature }}' \
            --seed '${{ inputs.seed }}' \
            --output runs/matchups/conditioned-openings.json

      - name: Write readable summary
        if: always() && hashFiles('runs/matchups/conditioned-openings.json') != ''
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path

          data = json.loads(Path('runs/matchups/conditioned-openings.json').read_text())
          lines = [
              '# Conditioned opening comparison',
              '',
              f"**Preview:** {data['a_plan']['name']} vs {data['b_plan']['name']}",
              f"**Paired design:** {data['trajectories']} trajectories × {data['repeats']} RNG repeats per forced opening",
              f"**Continuation diversification:** turns 2–{data['diversify_turns']}",
              f"**Action pool:** score gap {data['score_gap']}, cap {data['max_candidates']}, temperature {data['temperature']}",
              '',
              '| Opening | Record | Win rate | 95% CI |',
              '|---|---:|---:|---:|',
          ]
          for row in data['lines']:
              s = row['summary']
              lo, hi = s['a_wilson_95']
              lines.append(
                  f"| {row['line']['name']} | {s['a_wins']}–{s['b_wins']}–{s['draws']} | {s['a_win_rate']:.1%} | {lo:.1%}–{hi:.1%} |"
              )
          lines += [
              '',
              '> Team A turn 1 is fixed per candidate line. The opponent still diversifies on turn 1, and both sides diversify subsequent opening turns using scored legal joint orders. All candidate openings reuse the same policy seeds, battle seeds, and seat assignments for paired comparison.',
          ]
          Path(os.environ['GITHUB_STEP_SUMMARY']).write_text('\n'.join(lines) + '\n')
          PY

      - name: Upload conditioned opening report
        if: always() && hashFiles('runs/matchups/conditioned-openings.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: conditioned-openings-${{ inputs.trajectories }}x${{ inputs.repeats }}-seed-${{ inputs.seed }}
          path: runs/matchups/conditioned-openings.json
          retention-days: 30
